[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1

    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1

    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH

    -D USE_HSPI_PORT=1

    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1

    -D SPI_FREQUENCY=40000000

    -D LV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^9.2.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    adafruit/DHT sensor library